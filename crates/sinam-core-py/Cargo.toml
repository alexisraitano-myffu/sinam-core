[package]
name = "sinam-core-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 binding of sinam-core for the sinam desktop host (FastAPI backend)."

[lib]
name = "sinam_core_py"
crate-type = ["cdylib"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sinam-core = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }

[build-dependencies]
sha2 = "0.10"
