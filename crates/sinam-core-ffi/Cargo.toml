[package]
name = "sinam-core-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI binding of sinam-core for the sinam mobile apps (Kotlin/Swift)."

[lib]
name = "sinam_core_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[features]
default = ["sinam-core/ort-download"]
# Android/iOS builds: the app ships libonnxruntime and ort loads it at runtime.
ort-dynamic = ["sinam-core/ort-dynamic"]
# Transcription vocale locale (whisper.cpp). Hors du defaut : elle exige cmake
# au build, et l'amorcage par le graphe, lui, est expose sans elle.
voice = ["sinam-core/voice"]

[dependencies]
sinam-core = { path = "../sinam-core", version = "0.1.0", default-features = false }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
