# T4 phase 1 — the iOS toolchain wall, entirely in CI (no local
# Xcode). Produces SinamCore.xcframework + UniFFI Swift bindings, and proves
# embedding parity by running the same probe on macOS and on an iOS simulator.
#
# ONNX Runtime on iOS: the official CocoaPods archive (onnxruntime-c) ships a
# STATIC onnxruntime.xcframework — no dylib to dlopen, so unlike Android
# (ort-load-dynamic + AAR) we build with no ort feature and let ort-sys link
# the framework: ORT_IOS_XCFWK_PATH points at the xcframework and ort-sys
# picks the slice per target and links c++/Foundation/CoreML/clang_rt itself.
# The app must link onnxruntime.xcframework next to ours.
name: ios-core

on:
  push:
    branches: [main]
    # Docs-only pushes to main must not burn a full iOS build.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: ios-core-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must satisfy ort 2.0.0-rc.12 (ONNX Runtime API >= 1.24); same line as the
  # Android AAR (com.microsoft.onnxruntime:onnxruntime-android:1.27.0).
  ORT_IOS_VERSION: "1.27.0"
  MODEL_REPO: qdrant/paraphrase-multilingual-MiniLM-L12-v2-onnx-Q

jobs:
  xcframework:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ORT_IOS_XCFWK_PATH: ${{ github.workspace }}/ort-libs/onnxruntime.xcframework
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Fetch onnxruntime iOS static framework
        run: |
          set -euo pipefail
          # URL from the onnxruntime-c podspec on the CocoaPods CDN (verified).
          curl -sSfL "https://download.onnxruntime.ai/pod-archive-onnxruntime-c-${ORT_IOS_VERSION}.zip" \
            -o /tmp/ort-pod.zip
          mkdir -p ort-libs
          unzip -q /tmp/ort-pod.zip -d /tmp/ort-pod
          cp -R /tmp/ort-pod/onnxruntime.xcframework ort-libs/onnxruntime.xcframework
          ls ort-libs/onnxruntime.xcframework

      - name: Build FFI staticlib (device)
        run: |
          cargo build -p sinam-core-ffi --release --no-default-features \
            --features voice-metal --target aarch64-apple-ios

      - name: Build FFI staticlib (simulator)
        run: |
          cargo build -p sinam-core-ffi --release --no-default-features \
            --features voice-metal --target aarch64-apple-ios-sim

      # `voice-metal` et pas `voice` : whisper.cpp sait utiliser le GPU sur iOS,
      # là où sur Android le Mali lui est inaccessible sans un chantier Vulkan.
      # Mesuré sur un M1, Metal met `small` à 0,25× le temps réel contre 0,13×
      # au processeur seul, et rend `large-v3-turbo` jouable ; les puces A18 et
      # suivantes sont de la même classe. C'est ce qui autorise un modèle par
      # défaut différent sur iPhone et sur Android, décidé par la mesure et non
      # par symétrie.
      #
      # Ça ajoute `libggml-metal.a` aux archives à fusionner (le glob ci-dessous
      # la prend) et impose à l'app de lier **Metal et MetalKit** en plus
      # d'Accelerate.
      # whisper.cpp arrive en archives SÉPARÉES (libwhisper, libggml*), posées
      # par cmake dans le OUT_DIR du build script. Sur Android le cdylib les
      # absorbe ; ici on produit une bibliothèque STATIQUE, donc elles ne sont
      # dans rien et l'app échouerait à l'édition de liens sur des symboles
      # `whisper_*` introuvables. On les fusionne en une seule archive, la
      # seule que le xcframework transporte.
      #
      # `libggml-blas.a` existe parce que ggml active Accelerate par défaut sur
      # Apple — d'où le framework Accelerate à lier côté app.
      - name: Merge whisper/ggml archives into the staticlib
        run: |
          set -euo pipefail
          for triple in aarch64-apple-ios aarch64-apple-ios-sim; do
            libs=$(find "target/$triple/release/build" \
              -path '*whisper-rs-sys*/out/lib/*.a' | sort)
            if [ -z "$libs" ]; then
              echo "aucune archive whisper pour $triple" >&2; exit 1
            fi
            echo "$triple :"; echo "$libs" | sed 's/^/  /'
            libtool -static -no_warning_for_no_symbols \
              -o "target/$triple/release/libsinam_core_ffi_full.a" \
              "target/$triple/release/libsinam_core_ffi.a" $libs
          done

      - name: Generate Swift bindings
        run: |
          set -euo pipefail
          # ⚠️ MÊMES features que la lib iOS : la surface UniFFI dépend de
          # `voice`, et un binding généré sans elle n'a pas de `Transcriber`.
          cargo build -p sinam-core-ffi --release --features voice-metal
          cargo run -p sinam-core-ffi --release --features voice-metal \
            --bin uniffi-bindgen -- \
            generate --library target/release/libsinam_core_ffi.dylib \
            --language swift --out-dir target/swift
          ls -la target/swift
          # Garde-fou : l'absence de Transcriber ne casse pas la génération,
          # elle casse la compilation de l'app, beaucoup plus tard.
          grep -q "class Transcriber" target/swift/*.swift \
            || { echo "binding Swift sans Transcriber" >&2; exit 1; }

      - name: Assemble SinamCore.xcframework
        run: |
          set -euo pipefail
          # `xcodebuild -create-xcframework` n'écrase pas : si la sortie existe
          # déjà, il s'arrête sur « xc-headers couldn't be copied to ios-arm64 »
          # (exit 70). Le dossier survit d'un run à l'autre parce que le cache
          # Rust restaure `target/` — d'où un échec à CHAQUE push, et zéro
          # artefact iOS produit depuis des semaines. Repartir d'une sortie
          # propre, quelle que soit la raison de sa présence.
          rm -rf target/SinamCore.xcframework target/xc-headers
          mkdir -p target/xc-headers
          cp target/swift/*FFI.h target/xc-headers/
          cp target/swift/*FFI.modulemap target/xc-headers/module.modulemap
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libsinam_core_ffi_full.a \
              -headers target/xc-headers \
            -library target/aarch64-apple-ios-sim/release/libsinam_core_ffi_full.a \
              -headers target/xc-headers \
            -output target/SinamCore.xcframework

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: model
          key: model-v1

      - name: Download embedding model
        run: |
          set -euo pipefail
          if [ -f model/model_optimized.onnx ]; then exit 0; fi
          mkdir -p model
          for f in model_optimized.onnx tokenizer.json config.json \
                   special_tokens_map.json tokenizer_config.json; do
            curl -sSfL "https://huggingface.co/$MODEL_REPO/resolve/main/$f" \
              -o "model/$f"
          done
          ls -la model

      - name: Build embed_smoke (host + simulator)
        run: |
          set -euo pipefail
          cargo build -p sinam-core --release --bin embed_smoke
          cargo build -p sinam-core --release --bin embed_smoke \
            --no-default-features --target aarch64-apple-ios-sim

      - name: Embedding parity macOS vs iOS simulator
        run: |
          set -euo pipefail
          ./target/release/embed_smoke "$PWD/model" > host.json
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.isAvailable and (.name | test("^iPhone")))][0].udid')
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" \
            "$PWD/target/aarch64-apple-ios-sim/release/embed_smoke" "$PWD/model" > ios.json
          python3 scripts/ci/compare_vectors.py host.json ios.json

      - name: Upload xcframework + Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: SinamCore-ios
          path: |
            target/SinamCore.xcframework
            target/swift
          # Ce workflow tourne à chaque push sur main : avec la rétention par défaut
          # (90 j), 39 xcframeworks quasi identiques (~90 Mo pièce) dormaient encore
          # en août et saturaient le stockage Actions du compte. La release roulante
          # ci-dessous est le canal durable ; l'artefact n'est qu'une commodité.
          retention-days: 7

      # abi3 macOS wheel: lets any macOS CI (the app repo's iOS E2E job runs
      # the public backend on its runner) pip-install the core without a
      # local build.
      - name: Build macOS wheel
        run: |
          # PEP 668: the runner's Homebrew Python refuses bare pip installs.
          python3 -m venv /tmp/maturin-venv
          /tmp/maturin-venv/bin/pip install --quiet maturin
          /tmp/maturin-venv/bin/maturin build --release -m crates/sinam-core-py/Cargo.toml
          ls target/wheels

      # Rolling release consumed by the (private) app repo's iOS CI: a stable
      # public URL, refreshed on every green main build.
      - name: Publish rolling release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd target && zip -qry SinamCore.xcframework.zip SinamCore.xcframework)
          (cd target/swift && zip -qy ../SinamCore-swift-bindings.zip *)
          NOTES="Build $(git rev-parse --short HEAD) — onnxruntime iOS $ORT_IOS_VERSION (l'app doit lier onnxruntime.xcframework du pod onnxruntime-c à côté), transcription whisper.cpp avec Metal (lier aussi Accelerate, Metal et MetalKit)."
          gh release create core-ios --title "SinamCore iOS (rolling)" \
            --notes "$NOTES" --latest=false 2>/dev/null || \
            gh release edit core-ios --notes "$NOTES"
          gh release upload core-ios --clobber \
            target/SinamCore.xcframework.zip \
            target/SinamCore-swift-bindings.zip \
            target/wheels/*.whl
