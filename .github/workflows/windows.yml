# Windows build of the core: cargo tests (with the real model, so the
# ort-download runtime path is exercised end-to-end) + the sinam_core wheel
# as artifact. The app repo's Windows distribution workflow installs this
# wheel into the PyInstaller backend bundle instead of building it locally.
name: windows-core

on:
  push:
    branches: [main]
    # Docs-only pushes to main must not burn a full Windows build.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_REPO: qdrant/paraphrase-multilingual-MiniLM-L12-v2-onnx-Q

jobs:
  test-and-wheel:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: model
          key: model-v1
          enableCrossOsArchive: true

      - name: Download embedding model
        shell: bash
        run: |
          set -euo pipefail
          if [ -f model/model_optimized.onnx ]; then exit 0; fi
          mkdir -p model
          for f in model_optimized.onnx tokenizer.json config.json \
                   special_tokens_map.json tokenizer_config.json; do
            curl -sSfL "https://huggingface.co/$MODEL_REPO/resolve/main/$f" \
              -o "model/$f"
          done

      - name: cargo test (default members, model-backed)
        shell: bash
        env:
          SYNAPSE_MODEL_DIR: ${{ github.workspace }}/model
        run: cargo test --release

      # Le desktop charge le coeur par JNA, pas par le backend : il lui faut
      # une DLL, pas seulement la wheel. Meme binding genere que sur Android,
      # donc `voice` est obligatoire — sans elle la DLL n'a pas de Transcriber
      # et c'est l'app qui casse, beaucoup plus tard.
      - name: Build FFI cdylib (voice)
        run: cargo build -p sinam-core-ffi --release --features voice

      - name: Check the DLL carries the decoder
        shell: bash
        run: |
          set -euo pipefail
          ls -la target/release/sinam_core_ffi.dll
          # Les symboles UniFFI du transcripteur, sinon la DLL est muette la
          # ou l'app l'appelle.
          strings -a target/release/sinam_core_ffi.dll \
            | grep -q "uniffi_sinam_core_ffi_fn_constructor_transcriber_new" \
            || { echo "DLL sans Transcriber" >&2; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sinam_core wheel
        shell: bash
        run: |
          pip install maturin
          maturin build --release -m crates/sinam-core-py/Cargo.toml

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: sinam-core-wheel-windows
          path: target/wheels/*.whl
          if-no-files-found: error
          # Cf. ios.yml : rétention par défaut = 90 j et un push sur main par build.
          # La release roulante juste en dessous est le canal durable.
          retention-days: 7

      # Rolling release consumed by the (private) app repo's Windows
      # distribution workflow — same pattern as core-ios on ios.yml.
      - name: Publish rolling release (main only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Windows — wheel sinam_core + sinam_core_ffi.dll (transcription whisper.cpp incluse), build $(git rev-parse --short HEAD)"
          gh release create core-windows --title "SinamCore Windows (rolling)" \
            --notes "$NOTES" --latest=false 2>/dev/null || \
            gh release edit core-windows --notes "$NOTES"
          gh release upload core-windows --clobber \
            target/wheels/*.whl \
            target/release/sinam_core_ffi.dll
